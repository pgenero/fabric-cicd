name: "03 - Publicar Interest Rates en TEST"

# First laboratory publication. The user starts this workflow manually.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datahub-test-deployment
  cancel-in-progress: false

jobs:
  deploy-test:
    name: Publicar Interest Rates y su modelo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Comprobar rama y registrar version
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Este laboratorio se ejecuta desde main. Selecciona main en Run workflow."
            exit 1
          fi
          echo "Source commit: $GITHUB_SHA"
          echo "Selected solution: Interest Rates (SemanticModel + Report)"
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: DataHub-Test. Selection: Interest Rates model and report." >> "$GITHUB_STEP_SUMMARY"

      - name: Descargar la version seleccionada
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Revisar seleccion local
        run: python scripts/deploy_test.py --solution interest-rates

      - name: Comprobar destino e inventario antes de publicar
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          FABRIC_TEST_WORKSPACE_ID: ${{ vars.FABRIC_TEST_WORKSPACE_ID }}
        run: python scripts/check_test_workspace.py

      - name: Publicar exclusivamente Interest Rates y su modelo
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          FABRIC_TEST_WORKSPACE_ID: ${{ vars.FABRIC_TEST_WORKSPACE_ID }}
        run: >-
          python scripts/deploy_test.py
          --solution interest-rates
          --workspace-id "$FABRIC_TEST_WORKSPACE_ID"
          --deploy

      - name: Consultar inventario despues de publicar
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          FABRIC_TEST_WORKSPACE_ID: ${{ vars.FABRIC_TEST_WORKSPACE_ID }}
        run: python scripts/check_test_workspace.py
