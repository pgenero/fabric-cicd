name: "04 - Verificar actualizacion selectiva en TEST"

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datahub-test-deployment
  cancel-in-progress: false

jobs:
  verify-selectivity:
    name: Actualizar Interest Rates y comparar Stocks Index
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FABRIC_TEST_WORKSPACE_ID: ${{ vars.FABRIC_TEST_WORKSPACE_ID }}

    steps:
      - name: Comprobar rama y registrar version
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Selecciona main en Run workflow."
            exit 1
          fi
          echo "Source commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Deploy: Interest Rates. Compare unchanged: Stocks Index." >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Revisar seleccion local
        run: python scripts/deploy_test.py --solution interest-rates

      - name: Comprobar destino e inventario
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: python scripts/check_test_workspace.py

      - name: Capturar Stocks Index antes del despliegue
        id: baseline
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: python scripts/verify_stocks_unchanged.py before --directory "$RUNNER_TEMP/selectivity"

      - name: Publicar solo Interest Rates y su modelo
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: python scripts/deploy_test.py --solution interest-rates --workspace-id "$FABRIC_TEST_WORKSPACE_ID" --deploy

      - name: Comparar Stocks Index despues del despliegue
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: python scripts/verify_stocks_unchanged.py after --directory "$RUNNER_TEMP/selectivity"

      - name: Consultar inventario final
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: python scripts/check_test_workspace.py

      - name: Guardar evidencia de comparacion
        if: ${{ !cancelled() && steps.baseline.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: stocks-index-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/selectivity/*.json
          retention-days: 14
          if-no-files-found: error
