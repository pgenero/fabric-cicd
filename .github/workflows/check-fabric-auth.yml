name: "01 - Comprobar autenticacion Fabric"

# This workflow only runs when the user starts it from GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-auth:
    name: Comprobar Service Principal
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Descargar los archivos del repositorio
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt

      - name: Comprobar autenticacion sin desplegar
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        run: python scripts/deploy_test.py --solution interest-rates --check-auth
